name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run JavaScript actions on Node 24 now (the default from 2026-06-16).  This
# silences the Node 20 deprecation warnings, including those from the actions
# that alire-project/setup-alire@v6 (the latest) pins internally
# (actions/cache/restore, actions/setup-node), which we can't bump ourselves.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Alire + GNAT toolchain
        uses: alire-project/setup-alire@v6
        # Keep CI on the same GNAT major as local dev and the sibling
        # crates (tempus, nuntius); bump deliberately, not by drift.
        with:
          toolchain: gnat_native^15 gprbuild

      - name: Toolchain fingerprint for cache keys
        # Fold the toolchain version into every cache key below, so a
        # compiler bump starts a fresh dependency cache.
        run: |
          ver="$( { alr --version; alr toolchain; } 2>/dev/null || true )"
          echo "ALR_TOOLVER=$(printf '%s' "$ver" \
                              | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Cache the Alire dependency builds
        # Alire 2's build cache is content-addressed per
        # crate+configuration, so restoring it turns the dependency
        # builds into seconds; the key rotates when alire.toml or the
        # toolchain changes.
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/alire/builds
            ~/.local/share/alire/releases
          key: alire-deps-${{ runner.os }}-${{ env.ALR_TOOLVER }}-${{ hashFiles('alire.toml') }}
          restore-keys: |
            alire-deps-${{ runner.os }}-${{ env.ALR_TOOLVER }}-

      - name: No floating-point type in any source
        run: make no-float

      - name: Build the library (validation profile)
        # The `validation` profile adds -gnatwe (warnings are errors),
        # -gnata (assertions/contracts) and -gnato (overflow checks) on top
        # of the default warning + style set, so CI fails on any warning.
        # The profile is persisted in config/ and inherited by later steps.
        run: alr --non-interactive build --validation

      - name: Run the test suite (release -O3 and debug -O0)
        # `alr test` builds tests/test_tessera.gpr and runs the AUnit runner
        # and the Gherkin features once per MODE (see the [[actions]] in
        # alire.toml), exiting non-zero on any failed assertion or
        # scenario.  Both are fully offline.
        run: alr --non-interactive test

      - name: Set up node for the living documentation
        if: success() || failure()
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/features-report/package-lock.json

      - name: Render the living documentation
        # The features (release) with --report-json, rendered by
        # multiple-cucumber-html-reporter.  Rendered even when a scenario
        # failed -- the page is then the best account of what broke.
        if: success() || failure()
        run: make features-report

      - name: Keep the living documentation with the run
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: features-report
          path: obj/features-report/html
          if-no-files-found: ignore

      - name: Stage the living documentation for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: obj/features-report/html

  # The living documentation, published from main: what the reader
  # does, as the features state it, at https://ldm5180.github.io/tessera/.
  pages:
    name: Publish the living documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  proof:
    name: SPARK proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Alire + GNAT toolchain
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native^15 gprbuild

      - name: Toolchain fingerprint for cache keys
        run: |
          ver="$( { alr --version; alr toolchain; } 2>/dev/null || true )"
          echo "ALR_TOOLVER=$(printf '%s' "$ver" \
                              | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Cache the Alire dependency builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/alire/builds
            ~/.local/share/alire/releases
          key: alire-deps-${{ runner.os }}-${{ env.ALR_TOOLVER }}-${{ hashFiles('alire.toml') }}
          restore-keys: |
            alire-deps-${{ runner.os }}-${{ env.ALR_TOOLVER }}-

      - name: Build
        # Populates the config/ tree and the sml pin under alire/cache/pins,
        # which proof/proof.gpr sources directly.
        run: alr --non-interactive build

      - name: Install gnatprove
        run: |
          alr --non-interactive install --prefix="$HOME/.alire" gnatprove
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Prove
        # --checks-as-errors=on fails the job if any check is unproved;
        # --warnings=error fails it on any flow warning too (an output the
        # caller never reads is a bug or a dead parameter, never noise).
        run: |
          timeout 30m alr exec -- gnatprove -P proof/proof.gpr -j0 \
            --level=2 --checks-as-errors=on --warnings=error

  format:
    name: Formatting (gnatformat --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Alire + GNAT toolchain
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native^15 gprbuild

      - name: Install gnatformat
        run: |
          alr --non-interactive install --prefix="$HOME/.alire" gnatformat_bin
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          files=$(git ls-files 'src/*/*.ad[sb]' 'tests/src/*.ad[sb]' \
                               'bench/src/*.ad[sb]' 'proof/src/*.ad[sb]')
          echo "Checking:"; echo "$files"
          gnatformat --no-project --charset utf-8 --check $files
